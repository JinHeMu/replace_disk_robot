schema_version: 2
project: hard_disk_robot
task: precision_disk_insertion
runtime_backend: mujoco
# Scene constants are embodied in MJCF; this file documents the experiment contract.
# It is not a runtime scene generator or controller configuration.
target:
  socket_body: insertion_socket
  entry_frame: socket_entry
  drive_body: replacement_drive_held
  drive_frame: drive_center
  front_frame: drive_front
  ft_frame: wrist_ft_site
geometry:
  drive_dimensions_m: [0.177, 0.106, 0.026]
  drive_mass_kg: 0.20
  opening_dimensions_m: [0.1065, 0.0265]
  channel_depth_m: 0.040
  initial_front_gap_m: 0.010
  target_insertion_depth_m: 0.050
  grasp: ideal_rigid_rear_short_edge_thickness
stages:
  - {id: init, action: reset_already_grasped, completion: aligned_no_contact}
  - {id: prepare_ft, action: settle_and_tare, completion: baseline_recorded}
  - {id: insertion_experiment, action: future_force_control, completion: not_implemented}
safety_defaults:
  command_output_enabled: false
  force_limit_n: 10.0
  torque_limit_nm: 1.0
