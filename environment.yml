# System Conda envs directory is read-only in this workspace.
# Create/update with:
#   CONDA_ENVS_PATH="$PWD/.conda_envs" conda env create -f environment.yml
name: replace_disk_robot

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - numpy>=2.0,<3
  - pinocchio>=4.1,<5
  - pillow>=9
  - matplotlib>=3.8
  - pytest>=8,<9
  - pip
  - pip:
      - mujoco>=3.12,<4
      - -e .

# Keep ROS Humble and user-installed Python/native libraries out of this
# environment. Conda restores the previous values when the environment is
# deactivated.
variables:
  PYTHONNOUSERSITE: "1"
  PYTHONPATH: ""
  AMENT_PREFIX_PATH: ""
  COLCON_PREFIX_PATH: ""
  CMAKE_PREFIX_PATH: ""
  LD_LIBRARY_PATH: ""
  PKG_CONFIG_PATH: ""
  CPATH: ""
  CPLUS_INCLUDE_PATH: ""
  LIBRARY_PATH: ""
  ROS_DISTRO: ""
  ROS_VERSION: ""
  ROS_PYTHON_VERSION: ""
