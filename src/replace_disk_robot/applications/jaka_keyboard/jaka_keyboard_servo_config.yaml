# ============================================================================
# jaka_keyboard_servo.py 默认参数文件
# ----------------------------------------------------------------------------
# - 命令行显式传入的参数会覆盖本文件。
# - 使用其他配置文件：--config /path/to/other.yaml
# - 平移单位：m、m/s；旋转单位：rad、rad/s；力：N；力矩：N*m。
# ============================================================================

# ----------------------------------------------------------------------------
# 网络与主循环
# ----------------------------------------------------------------------------
robot_ip: "10.5.5.100"        # JAKA 控制器 IP
local_ip: "10.5.5.127"        # 本机 EDG/UDP 绑定 IP
rate_hz: 125.0                # EDG servo 循环频率；125 Hz 对应 step_num=1

# ----------------------------------------------------------------------------
# 键盘名义运动
# ----------------------------------------------------------------------------
linear_speed: 0.002           # 键盘平移速度，单位 m/s
angular_speed_deg: 1.0        # 键盘旋转速度，单位 deg/s
command_frame: base           # base=W/S/A/D 等用 jaka_base_link；tool=用当前 tool0
seconds: 0.0                  # >0 时运行指定秒数后退出；0=一直运行到 Esc/关窗
dry_run: false                # true=只读 EDG/F/T 和键盘，不使能 servo、不发运动
plot_wrench_enable: true      # true=打开六维力曲线窗口；false=关闭

# ----------------------------------------------------------------------------
# 安全限制
# ----------------------------------------------------------------------------
max_force_n: 15.0             # 力限：超过该力值立即停止并保持
max_torque_nm: 3.0            # 力矩限：超过该值立即停止并保持
max_joint_error_rad: 0.15     # 关节跟踪误差限，传给 CartesianServo
torque_sensor_mode: 1         # EDG 力矩传感器模式；必须输出未做重力补偿的原始值

# ----------------------------------------------------------------------------
# 去皮
# ----------------------------------------------------------------------------
tare_samples: 50              # 未开启重力补偿时，适配器 tare 的采样数
tare_period_ms: 10.0          # 适配器 tare 的采样周期，单位 ms
tare_enable: false            # true=开启适配器去皮；false=关闭（只影响非重力补偿路径）
tare_compensated: false       # true=以当前“重力补偿后的六维力”为额外零点

# ----------------------------------------------------------------------------
# 重力补偿后的滤波与死区
# ----------------------------------------------------------------------------
alpha: 0.2                    # 低通滤波系数；1.0=关闭低通
deadband_force: 1.0           # 力死区，按 Fx/Fy/Fz 分量，单位 N；0=关闭
deadband_torque: 0.5          # 力矩死区，按 Tx/Ty/Tz 分量，单位 N*m；0=关闭
identity_transform: false     # true=跳过传感器到 tool0 的旋转/力臂变换，仅诊断用

# ----------------------------------------------------------------------------
# 重力补偿
# ----------------------------------------------------------------------------
gravity_json: "tool/ft_gravity_samples_identified.json"  # 已替换为 tool0 外参修复后的 4° 约束标定；原文件内容已移除
gravity_compensation_enable: true  # true=开启重力补偿；false=关闭，使用适配器力处理

# ----------------------------------------------------------------------------
# 导纳柔顺模式
# ----------------------------------------------------------------------------
admittance: true             # true=开启导纳；开启时必须保持重力补偿开启
admittance_axes: translation  # 当前实机配置：仅平移柔顺；旋转导纳未验证
adm_disable_axes: []         # 在 admittance_axes 基础上禁用单轴；顺序 [x,y,z,rx,ry,rz]，轴为 tool0 坐标系；[z] 表示关闭 Z 轴平移导纳

# 导纳质量：顺序 [x,y,z,rx,ry,rz]，平移单位 kg，旋转单位 kg*m^2
adm_mass: [20.0, 20.0, 20.0, 2.0, 2.0, 2.0]

# 导纳阻尼：顺序 [x,y,z,rx,ry,rz]，平移单位 N*s/m，旋转单位 N*m*s/rad
adm_damping: [300.0, 300.0, 300.0, 15, 15, 15]

# 导纳刚度：顺序 [x,y,z,rx,ry,rz]，平移单位 N/m，旋转单位 N*m/rad
# 设为 0 表示该轴没有回正弹簧；实机首次测试建议使用小的非零刚度。
adm_stiffness: [30.0, 30.0, 30.0, 2.0, 2.0, 2.0]

# 导纳速度上限：顺序 [x,y,z,rx,ry,rz]，平移单位 m/s，旋转单位 rad/s
adm_max_velocity: [0.05, 0.05, 0.05, 0.17, 0.17, 0.17]

# 柔顺偏移相对名义位姿的平移钳位，单位 m
adm_max_offset_m: 0.2

# 柔顺偏移相对名义位姿的旋转钳位，单位 deg
adm_max_offset_deg: 10.0
