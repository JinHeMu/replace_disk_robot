# Xbox controller: share keyboard servo/force/admittance algorithms.
# Explicit --backend real selects hardware; default opens MuJoCo.
backend: sim
robot_ip: "10.5.5.100"
local_ip: "10.5.5.127"
rate_hz: 125.0
linear_speed: 0.2           # m/s at full deflection
angular_speed_deg: 4.0      # deg/s at full deflection
command_frame: base
seconds: 0.0
dry_run: false
plot_wrench_enable: false
controller_index: 0
joy_deadzone: 0.15           # rescaled continuously from deadzone to full speed
joy_precision_scale: 0.25   # hold RB together with LB
joy_timeout_s: 0.15
keyframe: low
max_force_n: 15.0
max_torque_nm: 3.0
max_joint_error_rad: 0.15
torque_sensor_mode: 1
tare_enable: false
tare_compensated: false
alpha: 0.2
deadband_force: 1.0
deadband_torque: 0.5
identity_transform: false
# Used only on hardware; simulation uses the MJCF payload and sensor poses.
gravity_json: "tool/ft_gravity_samples_identified.json"
gravity_compensation_enable: true
admittance: true
admittance_axes: translation
adm_disable_axes: []
adm_mass: [20.0, 20.0, 20.0, 2.0, 2.0, 2.0]
adm_damping: [300.0, 300.0, 300.0, 15.0, 15.0, 15.0]
adm_stiffness: [30.0, 30.0, 30.0, 2.0, 2.0, 2.0]
adm_max_velocity: [0.05, 0.05, 0.05, 0.17, 0.17, 0.17]
adm_max_offset_m: 0.2
adm_max_offset_deg: 10.0
